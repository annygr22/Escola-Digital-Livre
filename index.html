<!DOCTYPE html> 
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">
<!-- Elemento raiz da página. lang="pt-BR" define o idioma  -->

<head>
    <!-- Informações de bastidores: não aparecem diretamente na tela  -->

    <meta charset="UTF-8"> <!-- Codificação de caracteres, garante acentos corretos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ativa a responsividade em dispositivos móveis -->

    <title>Escola Digital Livre</title> <!-- Titulo exibido na aba do navegador -->

    <link rel="stylesheet" href="style.css"> 
    <!-- Conecta o arquivo de estilos (CSS) -->
</head>
<body>
    <!-- Tudo que o usuário vê e interage fica aqui -->

    <header class="header">
        <!-- Tag semântica: indica o cabeçalho da página -->

        <div class="header-container">
        <!-- Container que agrupa e centraliza o conteúdo do header -->

            <a href="#" class="logo">
                <!-- Logo clicável, leva para a home -->

                <img src="./assets/logo.png" alt="Logo Educação Digital Livre">
                <!-- img: adiciona imagem / src: caminho da imagem / alt: legenda da imagem -->

                <span class="Logo-text"> 
                    <!--  SPAN: ELEMENTO DE TEXTO INLINE, NÃO QUEBRA LINHA SOZINHO -->
                    <span class="logo-title"> Escola Digital Livre</span>
                    <span class="logo-subtitle">Aprendizado Livre</span>
                </span>
              
            </a>
            <nav class="main-nav">

                <!-- tag semantica para menu de navegação -->

                 <a href="index.html" class="nav-link active" >Inicio</a> 
                 <!-- "a"(link) para navegação ; href é o caminho da página
                  ; "active" destaca a pagina atual -->
                 <a href="./cursos.html" class="nav-link">Cursos</a>
                 <a href="#" class="nav-link">Sobre</a>
                 <a href="#" class="nav-link">Contato</a>

            </nav>

            <div class="header-actions">
                <!-- coloca o nome da classe.onome e da enter, e seja feliz; agrupa os botões de busca e botão CTA -->
                 
                <div class="search-box">
                    <input type="text" placeholder="Buscar Cursos..."> 
                    <!-- input: campo de entrada; placeholder:some assim que o usuario digita  -->

                    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="20" height="20" viewBox="0 0 30 30">
                    <path d="M 13 3 C 7.4886661 3 3 7.4886661 3 13 C 3 18.511334 7.4886661 23 13 23 C 15.396652 23 17.59741 22.148942 19.322266 20.736328 L 25.292969 26.707031 A 1.0001 1.0001 0 1 0 26.707031 25.292969 L 20.736328 19.322266 C 22.148942 17.59741 23 15.396652 23 13 C 23 7.4886661 18.511334 3 13 3 z M 13 5 C 17.430666 5 21 8.5693339 21 13 C 21 17.430666 17.430666 21 13 21 C 8.5693339 21 5 17.430666 5 13 C 5 8.5693339 8.5693339 5 13 5 z"></path>
                    </svg>
                    <!-- Icone vetorial da lupa -->

                </div>

                 <button class="btn-primary">Começar agora</button>
                    <!-- Botões para ações da página -->
            </div>
        </div>
    </header>
</body>
</html>
